<line x1="570.0" x2="670.0" y1="52" y2="52" stroke="#DCDEE5" stroke-width="2" stroke-linecap="round"/>
<circle cx="540.0" cy="52" r="20" fill="#A83D18"/>
<text class="b" x="540.0" y="58" font-size="17" text-anchor="middle" style="fill:#FFFFFF">4</text>
<text class="b" x="520.0" y="98" font-size="15.5">They rank and</text>
<text class="b" x="520.0" y="118" font-size="15.5">explain</text>
<text class="m" x="520.0" y="140" font-size="13.5">A score and a</text>
