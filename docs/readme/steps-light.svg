<text class="m" x="200.0" y="159" font-size="13.5">days, history.</text>
<line x1="410.0" x2="510.0" y1="52" y2="52" stroke="#DCDEE5" stroke-width="2" stroke-linecap="round"/>
<circle cx="380.0" cy="52" r="20" fill="#A83D18"/>
<text class="b" x="380.0" y="58" font-size="17" text-anchor="middle" style="fill:#FFFFFF">3</text>
<text class="b" x="360.0" y="98" font-size="15.5">They search the</text>
<text class="b" x="360.0" y="118" font-size="15.5">web</text>
<text class="m" x="360.0" y="140" font-size="13.5">Each event keeps its</text>
