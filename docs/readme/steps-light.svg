<svg xmlns="http://www.w3.org/2000/svg" width="880" height="189" viewBox="0 0 880 189" role="img" aria-label="How it works. 1. Set your profile. Likes, avoids, price cap, languages. 2. Agents read context. Profile, trips, busy days, history. 3. They search the web. Each event keeps its source URL. 4. They rank and explain. A score and a one-line reason. 5. You read the feed. Web, Loco, or ask any chat.">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Inter,'Segoe UI',Helvetica,Arial,sans-serif;fill:#14161D}.m{fill:#585E6D}.cap{font-size:11px;letter-spacing:.06em}.b{font-weight:600}</style>
<rect x="0.5" y="0.5" width="879" height="188" rx="12" fill="#FFFFFF" stroke="#DCDEE5"/>
