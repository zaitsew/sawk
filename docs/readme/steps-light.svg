<text class="b" x="40.0" y="98" font-size="15.5">Set your profile</text>
<text class="m" x="40.0" y="120" font-size="13.5">Likes, avoids, price</text>
<text class="m" x="40.0" y="139" font-size="13.5">cap, languages.</text>
